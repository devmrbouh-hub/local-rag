# Ollama в CI не поднимаем: тесты мокают эмбеддинги и LLM.
name: ci

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Тесты
        run: pytest -q
